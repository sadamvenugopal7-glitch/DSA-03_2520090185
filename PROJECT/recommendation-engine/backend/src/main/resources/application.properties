# Server Port (Defaults to 8080, overridable with PORT env var)
server.port=${PORT:8080}

# MongoDB Connection String (Defaults to local MongoDB, overridable with MONGODB_URI env var)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/recommendation_engine}

# Logging configuration
logging.level.com.recommendationengine=INFO
logging.level.org.springframework.data.mongodb=INFO

# Static Resource Handling (serve frontend files directly)
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
